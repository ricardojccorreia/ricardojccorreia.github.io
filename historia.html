<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>História de I&amp;D — Ricardo Cruz-Correia</title>
<meta name="description" content="Ricardo Cruz-Correia — vinte anos de investigação em sistemas de informação em saúde, contados período a período.">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<style>
/* Fundo contínuo (técnica da skill deck-contínuo): uma camada fixa cujas
   cores interpolam entre cenas; cada período tem a cor do seu tema. */
@property --c1{syntax:'<color>';inherits:true;initial-value:#08133a}
@property --c2{syntax:'<color>';inherits:true;initial-value:#13286b}
@property --glow{syntax:'<color>';inherits:true;initial-value:rgba(127,156,255,.22)}
@property --gx{syntax:'<percentage>';inherits:true;initial-value:22%}
@property --gy{syntax:'<percentage>';inherits:true;initial-value:28%}
:root{--c1:#08133a;--c2:#13286b;--glow:rgba(127,156,255,.22);--gx:22%;--gy:28%;color-scheme:dark}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:#08133a;color:#eef2ff}
::selection{background:#2b4596;color:#fff}
:focus-visible{outline-color:#fff}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(110vw 110vh at var(--gx) var(--gy),var(--glow),transparent 62%),
  linear-gradient(155deg,var(--c1) 0%,var(--c2) 100%);
  transition:--c1 1.1s ease,--c2 1.1s ease,--glow 1.1s ease,--gx 1.4s cubic-bezier(.16,1,.3,1),--gy 1.4s cubic-bezier(.16,1,.3,1)}
@media (prefers-reduced-motion:reduce){.bg{transition:none}}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:6px 16px;background:linear-gradient(#08133acc,transparent)}
.top a.home{font:600 .9rem/1 var(--sans);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;flex:1}
.top a.home .c{color:#bcc6e8;margin-right:8px}
.top button{min-width:44px;height:44px;padding:0 10px;background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:3px;font:600 .82rem/1 var(--sans);letter-spacing:.04em;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.12)}

.dots{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:2px}
.dots a{width:44px;height:32px;display:flex;align-items:center;justify-content:flex-end;text-decoration:none}
.dots a span{width:9px;height:9px;border-radius:50%;border:1.5px solid #eef2ff;transition:transform .3s,background .3s}
.dots a[aria-current="true"] span{background:#eef2ff;transform:scale(1.35)}

section.sc{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:88px max(16px,7vw) 72px}
.in{max-width:1080px;width:100%;margin:0 auto}
.lift{transition:transform .9s cubic-bezier(.16,1,.3,1)}
.js .lift{transform:translateY(18px)}
.js .on .lift{transform:none}
@media (prefers-reduced-motion:reduce){.js .lift{transform:none}}

.c{color:#bcc6e8}
.cover h1{font-size:clamp(3rem,9vw,7.5rem);line-height:.92;font-stretch:72%}
.cover h1 .c{display:inline-block;font-size:.9rem;vertical-align:.4em;margin-right:16px}
.cover p.lede{font:500 clamp(1.15rem,2.2vw,1.6rem)/1.35 var(--sans);max-width:36ch;margin:22px 0 0;color:#eef2ff}
.cover .how{margin:34px 0 0;font:500 .95rem/1.5 var(--sans);color:#bcc6e8}
.cover .how kbd{font:600 .8rem/1 var(--mono);border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:3px 6px;color:#fff}

.ficha{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px}
.ficha h2{color:#eef2ff;margin-bottom:14px}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font:400 .95rem/1.45 var(--serif)}
.ficha dt{font:600 .82rem/1.45 var(--sans);color:#bcc6e8;text-transform:uppercase;letter-spacing:.06em}
.ficha dd{margin:0}
.gl{list-style:none;margin:0;padding:0;columns:2;column-gap:24px;font:400 .9rem/1.4 var(--serif)}
.gl li{break-inside:avoid;padding:4px 0}
.gl b{font:700 .9rem/1 var(--sans);margin-right:6px}

.per{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px 56px;align-items:end}
.per .num{display:flex;align-items:center;gap:14px;font:600 1rem/1 var(--mono);color:#eef2ff}
.per .num span{width:44px;height:44px;border:1.5px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.per h2{display:block;margin:16px 0 0;font:800 clamp(2.4rem,6vw,5rem)/.95 var(--sans);font-stretch:74%;letter-spacing:-.015em;text-transform:none;text-wrap:balance}
.per .stat{margin:26px 0 0;display:flex;align-items:baseline;gap:12px;font:500 1rem/1.3 var(--sans);color:#eef2ff}
.per .stat b{font:800 3.2rem/1 var(--sans);font-stretch:80%;color:#fff}
.per .part{font:600 .72rem/1 var(--mono);border:1px dashed currentColor;padding:4px 6px 3px;border-radius:2px;margin-left:4px}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:132px 1fr 28px;gap:10px;align-items:center;padding:6px 0;font:500 .92rem/1.2 var(--sans)}
.bars i{display:block;height:8px;background:#eef2ff;border-radius:2px}
.bars b{font:600 .85rem/1 var(--mono);text-align:right}
.side h3{margin:0 0 10px;font:700 .82rem/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#bcc6e8}
.side+.side{margin-top:26px}
.pj{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font:600 1rem/1.3 var(--sans)}
.pj li{display:inline-flex;align-items:center;gap:8px}
.stamp{color:#d9bcff}
.go{display:inline-flex;align-items:center;min-height:44px;margin-top:22px;font:700 1rem/1.2 var(--sans);text-decoration:none;border-bottom:2px solid #eef2ff}
.go:hover{border-color:#d9bcff;color:#d9bcff}

.end h2{display:block;font:800 clamp(2.4rem,6vw,4.6rem)/.98 var(--sans);font-stretch:74%;text-transform:none;letter-spacing:-.015em;max-width:18ch}
.end p{font:400 1.15rem/1.6 var(--serif);max-width:52ch;color:#eef2ff}
.end nav{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:20px}

.idx{position:fixed;inset:0;z-index:10;background:rgba(5,12,38,.94);display:none;overflow:auto;padding:72px max(16px,7vw)}
.idx.open{display:block}
.idx h2{color:#eef2ff;margin-bottom:18px}
.idx ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0 28px;max-width:1080px}
.idx a{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;padding:14px 0;border-top:1px solid #3d5296;text-decoration:none}
.idx a .n{grid-row:span 2;font:600 .9rem/1.5 var(--mono);color:#bcc6e8}
.idx a b{font:700 1.05rem/1.25 var(--sans)}
.idx a span{font:400 .9rem/1.3 var(--sans);color:#bcc6e8}

@media (max-width:820px){
  .per,.ficha{grid-template-columns:1fr}
  .gl{columns:1}
  .dots{display:none}
  .ficha dl{grid-template-columns:1fr;gap:2px}
  .ficha dd{margin-bottom:8px}
}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>

<header class="top">
  <a class="home" id="home" href="./"><span class="c">(19)</span><span>Ricardo Cruz-Correia</span></a>
  <button id="idxbtn" type="button" aria-haspopup="dialog"></button>
  <button id="lang" type="button"></button>
</header>

<nav class="dots" id="dots" aria-label="Secções"></nav>
<main id="main"></main>

<div class="idx" id="idx" role="dialog" aria-modal="true" aria-labelledby="idxh" hidden>
  <h2 id="idxh"></h2>
  <ol id="idxlist"></ol>
</div>

<script src="data/trajetoria.js"></script>
<script>
document.documentElement.classList.add("js");

/* Tema de cada período: índice em TL_AREAS (escolha editorial a partir dos títulos) */
const SCENE_AREA = [0, 2, 0, 5, 3, 4, 3];
/* Cores das áreas na versão cianotipia (iguais a assets/site.css, tema escuro) */
const AREA_HEX = ["#7f9cff", "#3fc1cf", "#8c99ad", "#f0c46a", "#9fdb8f", "#ff9fb1", "#a9b2c8"];

const UI = {
  pt:{home:"Ricardo Cruz-Correia", idx:"Índice", lang:"EN", langLabel:"Switch to English",
      title:"Vinte anos de sistemas de informação em saúde",
      lede:"Da integração de dados hospitalares à IA generativa, contado período a período a partir das publicações e dos projetos.",
      how:"Desça para avançar. <kbd>O</kbd> abre o índice; <kbd>←</kbd> <kbd>→</kbd> mudam de período.",
      fichaH:"Ficha técnica", glH:"Siglas",
      ficha:[["Autor","Ricardo Cruz-Correia, FMUP / MEDCIDS, Universidade do Porto"],
             ["Dados","Ciência Vitae, ORCID (as 50 obras mais recentes de 283) e Universidade do Porto, setembro de 2026; os mesmos do registo de I&D deste site"],
             ["Como foi feito","Com apoio de IA generativa (Claude, Anthropic — Claude Code), com as skills Impeccable e deck-contínuo, a partir da apresentação «Pesquisa e Colaboração UFG–U.Porto» (2026)"],
             ["Cores","Cada período tem a cor do seu tema dominante, escolhido a partir dos títulos e das publicações"],
             ["Limites","O período 2024–26 está incompleto. Os nomes dos projetos não são expandidos aqui; ver o registo"],
             ["Versão","1.0 · 30 de outubro de 2026"]],
      pubs:"publicações", partial:"parcial", top:"Áreas com mais publicações", proj:"Projetos-chave", ongoing:"Em curso",
      go:"Ver os projetos deste período →",
      endH:"Uma trajetória, de investigação a produto",
      endP:"A interoperabilidade atravessa os sete períodos; a IA e a educação são as áreas que mais cresceram desde 2018. Os detalhes estão no registo de projetos e nos perfis académicos.",
      reg:"Registo de projetos", prof:"Perfil", sections:"Secções", cover:"Início", end:"Fim"},
  en:{home:"Ricardo Cruz-Correia", idx:"Index", lang:"PT", langLabel:"Mudar para português",
      title:"Twenty years of health information systems",
      lede:"From hospital data integration to generative AI, told period by period from publications and projects.",
      how:"Scroll to move on. <kbd>O</kbd> opens the index; <kbd>←</kbd> <kbd>→</kbd> change period.",
      fichaH:"Technical note", glH:"Abbreviations",
      ficha:[["Author","Ricardo Cruz-Correia, FMUP / MEDCIDS, University of Porto"],
             ["Data","Ciência Vitae, ORCID (the 50 most recent of 283 works) and University of Porto, September 2026; the same as this site's R&D register"],
             ["How it was made","With generative AI support (Claude, Anthropic — Claude Code), using the Impeccable and deck-contínuo skills, from the presentation “Pesquisa e Colaboração UFG–U.Porto” (2026)"],
             ["Colours","Each period takes the colour of its dominant theme, chosen from its title and publications"],
             ["Limits","The 2024–26 period is incomplete. Project names are not expanded here; see the register"],
             ["Version","1.0 · 30 October 2026"]],
      pubs:"publications", partial:"partial", top:"Areas with most publications", proj:"Key projects", ongoing:"Ongoing",
      go:"See this period's projects →",
      endH:"One trajectory, from research to product",
      endP:"Interoperability runs through all seven periods; AI and education are the areas that have grown most since 2018. The details are in the project register and the academic profiles.",
      reg:"Project register", prof:"Profile", sections:"Sections", cover:"Start", end:"End"}
};

const GLOSS = {
  pt:[["EHDS","Espaço Europeu de Dados de Saúde"],["FCG","Fundação Calouste Gulbenkian"],["FHIR","Fast Healthcare Interoperability Resources"],["FMUP","Faculdade de Medicina da Universidade do Porto"],["HL7","Health Level Seven"],["I&D","Investigação e desenvolvimento"],["IA","Inteligência artificial"],["MEDCIDS","Departamento de Medicina da Comunidade, Informação e Decisão em Saúde"],["openEHR","Norma aberta para registos de saúde eletrónicos"],["ORCID","Open Researcher and Contributor ID"],["UFG","Universidade Federal de Goiás"],["U.Porto","Universidade do Porto"]],
  en:[["AI","Artificial intelligence"],["EHDS","European Health Data Space"],["FCG","Calouste Gulbenkian Foundation"],["FHIR","Fast Healthcare Interoperability Resources"],["FMUP","Faculty of Medicine, University of Porto"],["HL7","Health Level Seven"],["MEDCIDS","Department of Community Medicine, Information and Health Decision Sciences"],["openEHR","Open standard for electronic health records"],["ORCID","Open Researcher and Contributor ID"],["R&D","Research and development"],["UFG","Federal University of Goiás"],["U.Porto","University of Porto"]]
};

const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const q=new URLSearchParams(location.search).get("lang");
let lang=(q==="pt"||q==="en")?q:(store.get("site_lang")||((navigator.language||"").toLowerCase().startsWith("pt")?"pt":"en"));
if(lang!=="pt"&&lang!=="en")lang="pt";

const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const mix=(h,base,t)=>{const a=parseInt(h.slice(1),16),b=parseInt(base.slice(1),16);
  const c=[16,8,0].map(s=>Math.round(((a>>s)&255)*t+((b>>s)&255)*(1-t)));return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join("")};
const POS=[["18%","24%"],["78%","22%"],["24%","78%"],["80%","70%"],["50%","18%"],["16%","56%"],["72%","40%"]];

function scenes(){
  const s=[{c1:"#08133a",c2:"#13286b",glow:hexA("#7f9cff",.22),gx:"22%",gy:"28%"},{c1:"#08133a",c2:"#0f2257",glow:hexA("#7f9cff",.12),gx:"80%",gy:"80%"}];
  TL_PERIODS.forEach((p,i)=>{const h=AREA_HEX[SCENE_AREA[i]];s.push({c1:"#08133a",c2:mix(h,"#08133a",.3),glow:hexA(h,.26),gx:POS[i][0],gy:POS[i][1]})});
  s.push({c1:"#08133a",c2:"#2a1f5e",glow:hexA("#d9bcff",.22),gx:"50%",gy:"50%"});
  return s;
}

function render(){
  const t=UI[lang]; document.documentElement.lang=lang;
  const home=document.getElementById("home"); home.href="./?lang="+lang;
  const lb=document.getElementById("lang"); lb.textContent=t.lang; lb.setAttribute("aria-label",t.langLabel); lb.setAttribute("lang",lang==="pt"?"en":"pt");
  document.getElementById("idxbtn").textContent=t.idx+" (O)";
  document.getElementById("idxh").textContent=t.idx;
  document.getElementById("dots").setAttribute("aria-label",t.sections);

  const areas=TL_AREAS.filter(a=>!a.other), maxN=Math.max(...areas.flatMap(a=>a.v.map(x=>x[0])));
  let h=`<section class="sc cover" id="s0"><div class="in lift"><h1><span class="c">(54)</span>${t.title}</h1><p class="lede">${t.lede}</p><p class="how">${t.how}</p></div></section>`;
  h+=`<section class="sc" id="s1"><div class="in lift ficha"><div><h2><span class="c">(56)</span>${t.fichaH}</h2><dl>${t.ficha.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`+
     `<div><h2><span class="c">(56)</span>${t.glH}</h2><ul class="gl">${GLOSS[lang].map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join("")}</ul></div></div></section>`;
  TL_PERIODS.forEach((p,i)=>{
    const top=areas.map(a=>({s:a[lang],n:a.v[i][0]})).filter(x=>x.n).sort((x,y)=>y.n-x.n).slice(0,3);
    const projs=TL_PROJECTS.filter(x=>tlPeriodOf(+x.start.slice(0,4))===i).slice().sort((a,b)=>(b.state==="ongoing")-(a.state==="ongoing")||(a.start<b.start?-1:1));
    const last=i===TL_PERIODS.length-1;
    h+=`<section class="sc" id="s${i+2}" aria-labelledby="ph${i}"><div class="in lift per"><div>`+
       `<p class="num"><span>${i+1}</span>${p}</p><h2 id="ph${i}">${TL_TITLE[lang][i]}</h2>`+
       `<p class="stat"><b>${TL_PUB_TOTAL[i]}</b>${t.pubs}${last?`<span class="part">${t.partial}</span>`:""}</p></div><div>`+
       `<div class="side"><h3>${t.top}</h3><ul class="bars">${top.map(x=>`<li><span>${x.s.split(" (")[0]}</span><i style="width:${Math.round(x.n/maxN*100)}%"></i><b>${x.n}</b></li>`).join("")}</ul></div>`+
       `<div class="side"><h3>${t.proj}</h3><ul class="pj">${projs.map(x=>`<li>${(lang==="en"&&x.short_en)||x.short}${x.state==="ongoing"?`<span class="stamp">${t.ongoing}</span>`:""}</li>`).join("")}</ul></div>`+
       `<a class="go" href="trajetoria.html?lang=${lang}#p${i}">${t.go}</a></div></div></section>`;
  });
  h+=`<section class="sc end" id="s${TL_PERIODS.length+2}"><div class="in lift"><h2>${t.endH}</h2><p>${t.endP}</p>`+
     `<nav><a class="go" href="trajetoria.html?lang=${lang}">${t.reg} →</a><a class="go" href="./?lang=${lang}">${t.prof} →</a><a class="go" href="https://orcid.org/0000-0002-3764-5158">ORCID →</a></nav></div></section>`;
  document.getElementById("main").innerHTML=h;

  const labels=[t.cover,t.fichaH,...TL_PERIODS.map((p,i)=>`${p} · ${TL_TITLE[lang][i]}`),t.end];
  document.getElementById("dots").innerHTML=labels.map((l,i)=>`<a href="#s${i}" aria-label="${l}"><span></span></a>`).join("");
  document.getElementById("idxlist").innerHTML=labels.map((l,i)=>{const [a,b]=i>=2&&i<labels.length-1?[TL_PERIODS[i-2],TL_TITLE[lang][i-2]]:["",l];
    return `<li><a href="#s${i}"><span class="n">${String(i+1).padStart(2,"0")}</span><b>${b}</b><span>${a}</span></a></li>`}).join("");
  observe();
}

const SC=scenes(); let cur=0, io;
function setScene(i){const s=SC[i],r=document.documentElement.style;r.setProperty("--c1",s.c1);r.setProperty("--c2",s.c2);r.setProperty("--glow",s.glow);r.setProperty("--gx",s.gx);r.setProperty("--gy",s.gy)}
function observe(){
  if(io)io.disconnect();
  const secs=[...document.querySelectorAll("section.sc")], dots=[...document.querySelectorAll("#dots a")];
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=secs.indexOf(e.target);cur=i;e.target.classList.add("on");setScene(i);
    dots.forEach((d,j)=>d.setAttribute("aria-current",j===i?"true":"false"))}}),{threshold:.5});
  secs.forEach(s=>io.observe(s));
}
const go=i=>{const s=document.getElementById("s"+Math.max(0,Math.min(SC.length-1,i)));if(s)s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})};

const idx=document.getElementById("idx"); let lastFocus=null;
function openIdx(){lastFocus=document.activeElement;idx.hidden=false;idx.classList.add("open");idx.querySelector("a").focus()}
function closeIdx(){idx.classList.remove("open");idx.hidden=true;if(lastFocus)lastFocus.focus()}
idx.addEventListener("click",e=>{if(e.target.closest("a")||e.target===idx)closeIdx()});
document.getElementById("idxbtn").addEventListener("click",openIdx);
document.getElementById("lang").addEventListener("click",()=>{lang=lang==="pt"?"en":"pt";store.set("site_lang",lang);const u=new URL(location.href);u.searchParams.set("lang",lang);history.replaceState(null,"",u);render()});
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(idx.classList.contains("open")){if(e.key==="Escape"){e.preventDefault();closeIdx()}return}
  if(e.key==="o"||e.key==="O"){e.preventDefault();openIdx()}
  else if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(cur+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1)}
});

render();
if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView()}
</script>
</body>
</html>
