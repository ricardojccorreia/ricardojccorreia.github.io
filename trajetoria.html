<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trajetória de I&amp;D — Ricardo Cruz-Correia</title>
<meta name="description" content="Ricardo Cruz-Correia — registo de projetos de I&D e publicações por área e por período, 2005–2026.">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<style>
.back{display:inline-flex;align-items:center;min-height:44px;font:600 .9rem/1 var(--sans);text-decoration:none}
.back:hover{text-decoration:underline}
.biblio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule);margin:0}
.biblio div{padding:18px 16px 18px 0;border-right:1px solid var(--rule-2)}
.biblio div+div{padding-left:16px}
.biblio div:last-child{border-right:0}
.biblio dt{display:flex;gap:8px;align-items:baseline;font:500 .9rem/1.35 var(--sans);color:var(--ink-2)}
.biblio dd{margin:4px 0 0;font:800 2rem/1 var(--sans);font-stretch:80%}
.biblio dd small{font:500 .85rem/1.3 var(--sans);color:var(--ink-2);display:block;margin-top:4px;font-stretch:100%}

.tbl{overflow-x:auto;margin:6px -16px 0;padding:0 16px;scrollbar-width:thin}
table.heat{border-collapse:collapse;width:100%;min-width:760px;font:500 .9rem/1.2 var(--sans);font-variant-numeric:tabular-nums}
.heat th,.heat td{border-bottom:1px solid var(--rule-2);padding:0}
.heat thead th{font:600 .78rem/1.2 var(--mono);color:var(--ink-2);text-align:center;padding:8px 4px;border-bottom:2px solid var(--ink)}
.heat th[scope=row],.heat thead th:first-child{position:sticky;left:0;background:var(--sheet);text-align:left;padding:10px 12px 10px 0;font:600 .92rem/1.25 var(--sans);z-index:1;min-width:190px;box-shadow:1px 0 0 var(--rule-2)}
.heat thead th:first-child{font:600 .78rem/1.2 var(--mono);color:var(--ink-2)}
.heat th[scope=row] i{display:inline-block;width:11px;height:11px;border:2px solid currentColor;margin-right:9px;vertical-align:-1px}
.heat td{text-align:center;padding:3px}
.heat td span{display:block;padding:8px 2px;border-radius:2px}
.heat td b{font-weight:700;font-size:1rem}
.heat td em{display:block;font:500 .7rem/1.2 var(--mono);font-style:normal;margin-top:3px}
.heat td.z span{color:var(--ink-2)}
.heat tfoot td,.heat tfoot th{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.heat .tot{font-weight:700}
.heat .sh{display:none}
.heat tr.other th[scope=row],.heat tr.other td{color:var(--ink-2)}

.filter{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.filter button{min-height:44px;padding:0 16px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:3px;font:600 .92rem/1 var(--sans);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.filter button:hover:not([aria-pressed="true"]){border-color:var(--ink)}
.filter b{font-family:var(--mono);font-weight:600;margin-left:6px}

.period{scroll-margin-top:12px;padding:22px 0 6px;border-top:2px solid var(--ink)}
.period+.period{margin-top:18px}
.ph{display:grid;grid-template-columns:34px 1fr auto;gap:4px 14px;align-items:baseline;margin-bottom:8px}
.ph .n{width:30px;height:30px;border:1.25px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 .85rem/1 var(--mono);align-self:center}
.ph h3{margin:0;font:750 clamp(1.15rem,2.2vw,1.45rem)/1.2 var(--sans)}
.ph h3 span{font:500 .85rem/1 var(--mono);color:var(--ink-2);margin-right:10px}
.ph p{margin:0;font:500 .88rem/1.3 var(--sans);color:var(--ink-2);text-align:right}
.period:target .ph h3{background:var(--blue-soft);box-shadow:-6px 0 0 var(--blue-soft),6px 0 0 var(--blue-soft)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) 70px 150px;gap:4px 18px;padding:12px 0;border-top:1px solid var(--rule-2);align-items:baseline}
.plist li:first-child{border-top:0}
.plist b{font:700 1rem/1.3 var(--sans)}
.plist .t{display:block;font:400 1rem/1.45 var(--serif);margin-top:2px}
.plist .r{display:block;font:500 .78rem/1.4 var(--mono);color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.plist .y{font:600 .9rem/1 var(--mono)}
.plist .s{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.role{font:600 .72rem/1 var(--mono);border:1px solid var(--rule);padding:4px 6px 3px;border-radius:2px;color:var(--ink)}
.src{font:400 .9rem/1.5 var(--serif);color:var(--ink-2);max-width:80ch;margin:28px 0 0}
section.blk{padding:28px 0 8px}
section.blk>p{margin:0 0 10px;color:var(--ink-2);max-width:72ch}
@media (max-width:720px){
  .biblio{grid-template-columns:1fr 1fr}
  .biblio div{border-right:0;border-bottom:1px solid var(--rule-2);padding-left:0 !important}
  .biblio div:nth-child(odd){padding-right:12px;border-right:1px solid var(--rule-2)}
  .biblio div:nth-child(even){padding-left:12px !important}
  .ph{grid-template-columns:34px 1fr}
  .ph p{grid-column:2;text-align:left}
  .plist li{grid-template-columns:auto 1fr}
  .plist li>div:first-child{grid-column:1/-1}
  .plist .s{justify-content:flex-start}
  .heat .lg{display:none}.heat .sh{display:inline}
  .heat th[scope=row],.heat thead th:first-child{min-width:118px;font-size:.85rem}
}
</style>
</head>
<body>
<header class="band">
  <div class="in">
    <span class="c">S1</span>
    <span class="who"><a href="./"><span>Ricardo Cruz-Correia</span> <span class="long">· FMUP / MEDCIDS</span></a></span>
    <div class="ctl"><button id="lang" type="button"></button><button id="theme" type="button"></button></div>
  </div>
</header>

<main class="sheet">
  <div class="meta">
    <a class="back" id="back" href="./"></a>
    <span data-i18n="updated"></span>
  </div>

  <div class="title">
    <div>
      <h1><span class="c">S1</span><span data-i18n="title"></span></h1>
      <p data-i18n="claim"></p>
    </div>
  </div>

  <dl class="biblio" id="biblio"></dl>

  <section class="fig blk" aria-labelledby="f1">
    <h2 id="f1"><span class="c">Fig. 1</span><span data-i18n="f1"></span></h2>
    <figure>
      <div class="figwrap"><svg id="fig" aria-hidden="true"></svg></div>
      <figcaption><b>Fig. 1</b><span data-i18n="f1cap"></span></figcaption>
    </figure>
  </section>

  <section class="blk" aria-labelledby="f2">
    <h2 id="f2"><span class="c">Fig. 2</span><span data-i18n="f2"></span></h2>
    <p data-i18n="f2note"></p>
    <div class="tbl" tabindex="0" role="region" aria-labelledby="f2"><table class="heat" id="heat"></table></div>
  </section>

  <section class="blk" aria-labelledby="reg">
    <h2 id="reg"><span class="c">Tabela S1</span><span data-i18n="reg"></span></h2>
    <div class="filter" id="filter" role="group"></div>
    <p class="sr" id="live" aria-live="polite"></p>
    <div id="periods"></div>
    <p class="src" data-i18n="src"></p>
    <p class="src"><a id="story" href="historia.html" data-i18n="story"></a></p>
  </section>
</main>

<footer>
  <span>Ricardo João Cruz Correia · FMUP / MEDCIDS · Universidade do Porto</span>
  <span><span data-i18n="contact"></span> <a href="https://pt.linkedin.com/in/ricardojccorreia">LinkedIn</a> · <a href="https://orcid.org/0000-0002-3764-5158">ORCID</a></span>
</footer>

<script src="data/trajetoria.js"></script>
<script src="assets/site.js"></script>
<script>
const UI = {
  pt:{back:"← Artigo principal: perfil de Ricardo Cruz-Correia", updated:"Atualizado em outubro de 2026 · dados de setembro de 2026", title:"Material suplementar — Trajetória de I&D",
      claim:"A interoperabilidade atravessa os sete períodos; a IA e a educação são as áreas que mais cresceram desde 2018.",
      f1:"Publicações e início de projetos", f1cap:"Linha: 170 publicações com data (Ciência Vitae e as 50 obras mais recentes do ORCID, que lista 283 no total); 2024–26 é parcial. Marcas: início de cada projeto; a violeta, os que estão em curso. Os números 1–7 levam ao registo de cada período.",
      f2:"Publicações e projetos por área", f2note:"Cada célula: número de publicações e, por baixo, projetos iniciados nesse período. Quanto mais escura a célula, mais publicações.",
      area:"Área", total:"Total", pubtot:"Publicações", proj:n => n === 1 ? "1 projeto" : n + " projetos",
      reg:"Registo de projetos", all:"Todos", ongoing:"Em curso", closed:"Concluído",
      pubs:n => n + " publicações", projs:n => n === 1 ? "1 projeto" : n + " projetos",
      shown:(n, f) => f ? `A mostrar ${n} projetos em curso.` : `A mostrar os ${n} projetos.`,
      roles:{"IR":"IR","Co-IR":"Co-IR"},
      src:"Fontes: Ciência Vitae, ORCID e Universidade do Porto (setembro de 2026). O período 2024–26 está incompleto. IR = investigador responsável. As traduções inglesas dos títulos são indicativas.",
      contact:"Contacto:", story:"Ver a mesma trajetória contada período a período (História) →"},
  en:{back:"← Main article: Ricardo Cruz-Correia's profile", updated:"Updated October 2026 · data from September 2026", title:"Supplementary material — R&D trajectory",
      claim:"Interoperability runs through all seven periods; AI and education are the areas that have grown most since 2018.",
      f1:"Publications and project starts", f1cap:"Line: 170 dated publications (Ciência Vitae and the 50 most recent ORCID works; ORCID lists 283 in total); 2024–26 is partial. Marks: start of each project; violet marks are ongoing. Numerals 1–7 lead to each period's register.",
      f2:"Publications and projects by area", f2note:"Each cell: number of publications and, below, projects started in that period. The darker the cell, the more publications.",
      area:"Area", total:"Total", pubtot:"Publications", proj:n => n === 1 ? "1 project" : n + " projects",
      reg:"Project register", all:"All", ongoing:"Ongoing", closed:"Closed",
      pubs:n => n + " publications", projs:n => n === 1 ? "1 project" : n + " projects",
      shown:(n, f) => f ? `Showing ${n} ongoing projects.` : `Showing all ${n} projects.`,
      roles:{"IR":"PI","Co-IR":"Co-PI"},
      src:"Sources: Ciência Vitae, ORCID and University of Porto (September 2026). The 2024–26 period is incomplete. PI = principal investigator. English project titles are indicative translations.",
      contact:"Contact:", story:"See the same trajectory told period by period (Story) →"}
};

let onlyOngoing = false;

function render(L) {
  const t = UI[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.getElementById("story").href = "historia.html?lang=" + L;
  const back = document.getElementById("back"); back.textContent = t.back; back.href = "./?lang=" + L;

  document.getElementById("biblio").innerHTML = TL_KPIS.map((k, i) => {
    const [main, extra] = k[L].split(" (");
    return `<div><dt>${main}</dt><dd>${k.v}${extra ? `<small>(${extra}</small>` : ""}</dd></div>`;
  }).join("");

  Site.figure(document.getElementById("fig"), L, {local: true});

  const max = Math.max(...TL_AREAS.flatMap(a => a.v.map(x => x[0])));
  let h = `<thead><tr><th scope="col">${t.area}</th>` + TL_PERIODS.map(p => `<th scope="col">${p}</th>`).join("") + `<th scope="col">${t.total}</th></tr></thead><tbody>`;
  for (const a of TL_AREAS) {
    let tp = 0, tj = 0;
    h += `<tr${a.other ? ' class="other"' : ""}><th scope="row"><i style="color:${a.other ? "var(--a7)" : "var(--a" + (TL_AREAS.indexOf(a) + 1) + ")"}"></i><span class="lg">${a[L]}</span><span class="sh">${a.s[L]}</span></th>`;
    for (const [n, j] of a.v) {
      tp += n; tj += j;
      const pct = n ? Math.round(6 + n / max * 34) : 0;
      h += `<td${n ? "" : ' class="z"'}><span style="background:${n ? `color-mix(in srgb, var(--a1) ${pct}%, var(--sheet))` : "transparent"}"><b>${n}</b>${j ? `<em>${t.proj(j)}</em>` : ""}</span></td>`;
    }
    h += `<td class="tot"><span><b>${tp}</b>${tj ? `<em>${t.proj(tj)}</em>` : ""}</span></td></tr>`;
  }
  h += `</tbody><tfoot><tr><th scope="row">${t.pubtot}</th>` + TL_PUB_TOTAL.map(x => `<td>${x}</td>`).join("") + `<td>${TL_PUB_TOTAL.reduce((a, b) => a + b, 0)}</td></tr></tfoot>`;
  document.getElementById("heat").innerHTML = h;

  const nOn = TL_PROJECTS.filter(p => p.state === "ongoing").length;
  document.getElementById("filter").innerHTML =
    `<button type="button" data-v="0" aria-pressed="${!onlyOngoing}">${t.all}<b>${TL_PROJECTS.length}</b></button>` +
    `<button type="button" data-v="1" aria-pressed="${onlyOngoing}">${t.ongoing}<b>${nOn}</b></button>`;

  let shown = 0;
  document.getElementById("periods").innerHTML = TL_PERIODS.map((p, i) => {
    const all = TL_PROJECTS.filter(x => tlPeriodOf(+x.start.slice(0, 4)) === i);
    const list = onlyOngoing ? all.filter(x => x.state === "ongoing") : all;
    if (!list.length && onlyOngoing) return "";
    shown += list.length;
    const rows = list.map(x => `<li><div><b>${(L === "en" && x.short_en) || x.short}</b><span class="t">${L === "en" ? x.title_en : x.title}</span><span class="r">${x.ref}</span></div>` +
      `<span class="y">${x.start.slice(0, 4)}</span>` +
      `<span class="s">${x.state === "ongoing" ? `<span class="stamp">${t.ongoing}</span>` : ""}${x.role ? `<span class="role">${t.roles[x.role] || x.role}</span>` : ""}</span></li>`).join("");
    return `<section class="period" id="p${i}" aria-labelledby="h${i}"><div class="ph"><span class="n" aria-hidden="true">${i + 1}</span>` +
      `<h3 id="h${i}"><span>${p}</span>${TL_TITLE[L][i]}</h3><p>${t.pubs(TL_PUB_TOTAL[i])} · ${t.projs(all.length)}</p></div>` +
      `<ul class="plist">${rows}</ul></section>`;
  }).join("");
  document.getElementById("live").textContent = t.shown(shown, onlyOngoing);
}

document.getElementById("filter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  onlyOngoing = b.dataset.v === "1"; render(Site.lang);
  document.querySelector(`#filter button[data-v="${b.dataset.v}"]`).focus();
});

Site.controls(render);
render(Site.lang);
if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
