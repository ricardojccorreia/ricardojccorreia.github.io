<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jorge Ribeiro · Currículo</title>
<meta name="description" content="O currículo de Jorge Ribeiro, animador e realizador do Porto, numa página contínua que muda de estilo a cada período.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Luckiest+Guy&family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=Fredoka:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Bungee&display=swap">
<style>
@font-face{font-family:"Archivo";src:url("../fonts/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("../fonts/jetbrains-mono.woff2") format("woff2");font-weight:100 800;font-display:swap}
/* Uma página contínua, ano a ano. Cada período tem a sua identidade (cores, letra, textura,
   forma dos cartões), tirada do trabalho desse tempo; a página troca de identidade ao descer. */
:root{
  --bg:#f3efe4;--fg:#2b2b2b;--acc:#5b7cff;--card:#fffdf6;--muted:rgba(43,43,43,.66);--line:rgba(43,43,43,.18);
  --display:"Caveat",cursive;--body:Georgia,"Times New Roman",serif;--ui:"Archivo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--body);transition:background-color .9s,color .9s}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}body,.work,.deco i{transition:none!important}}

/* ---------- identidades por período ---------- */
body[data-p="0"]{--bg:#f3efe4;--fg:#2b2b2b;--acc:#3d5afe;--card:#fffdf6;--muted:rgba(43,43,43,.66);--line:rgba(43,43,43,.2);--display:"Caveat",cursive}
body[data-p="1"]{--bg:#fff1b8;--fg:#2a1500;--acc:#e8590c;--card:#ffffff;--muted:rgba(42,21,0,.7);--line:#2a1500;--display:"Luckiest Guy",var(--ui)}
body[data-p="2"]{--bg:#eef3f6;--fg:#0f2a3d;--acc:#00838f;--card:#ffffff;--muted:rgba(15,42,61,.68);--line:rgba(15,42,61,.18);--display:"IBM Plex Sans Condensed",var(--ui)}
body[data-p="3"]{--bg:#0e1b38;--fg:#e9f1ff;--acc:#7be38a;--card:#172a55;--muted:rgba(233,241,255,.7);--line:rgba(233,241,255,.18);--display:"Fredoka",var(--ui)}
body[data-p="4"]{--bg:#1d0f15;--fg:#fbe9ee;--acc:#ff7f98;--card:#2a1720;--muted:rgba(251,233,238,.7);--line:rgba(251,233,238,.18);--display:"Playfair Display",Georgia,serif}
body[data-p="5"]{--bg:#f4e6ff;--fg:#2d0b4a;--acc:#8a3ffc;--card:#ffffff;--muted:rgba(45,11,74,.7);--line:rgba(45,11,74,.2);--display:"Bungee",var(--ui)}
body[data-p="6"]{--bg:#0b1a2e;--fg:#eaf4ff;--acc:#7fb8ff;--card:#12263f;--muted:rgba(234,244,255,.7);--line:rgba(234,244,255,.18);--display:"Archivo",var(--ui)}

/* texturas de fundo: uma camada por período, que aparece e desaparece */
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none}
.deco i{position:absolute;inset:0;opacity:0;transition:opacity .9s}
body[data-p="0"] .deco i:nth-child(1),body[data-p="1"] .deco i:nth-child(2),body[data-p="2"] .deco i:nth-child(3),body[data-p="3"] .deco i:nth-child(4),
body[data-p="4"] .deco i:nth-child(5),body[data-p="5"] .deco i:nth-child(6),body[data-p="6"] .deco i:nth-child(7){opacity:1}
.deco i:nth-child(1){background:linear-gradient(90deg,transparent 54px,rgba(230,80,80,.35) 54px 56px,transparent 56px),repeating-linear-gradient(transparent 0 31px,rgba(61,90,254,.14) 31px 32px)}
.deco i:nth-child(2){background:radial-gradient(rgba(232,89,12,.22) 22%,transparent 24%) 0 0/14px 14px}
.deco i:nth-child(3){background:linear-gradient(rgba(15,42,61,.06) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(15,42,61,.06) 1px,transparent 1px) 0 0/24px 24px}
.deco i:nth-child(4){background:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 72% 12%,#fff,transparent),radial-gradient(2px 2px at 40% 64%,#cfe,transparent),radial-gradient(1.5px 1.5px at 88% 52%,#fff,transparent),radial-gradient(1px 1px at 25% 88%,#fff,transparent),radial-gradient(2.5px 2.5px at 58% 34%,#ffe9a8,transparent),radial-gradient(1px 1px at 6% 52%,#fff,transparent),radial-gradient(60% 50% at 90% 100%,rgba(123,227,138,.14),transparent)}
.deco i:nth-child(5){background:repeating-radial-gradient(circle at 110% 50%,rgba(255,127,152,.07) 0 2px,transparent 2px 7px)}
.deco i:nth-child(6){background:radial-gradient(rgba(138,63,252,.18) 30%,transparent 32%) 0 0/46px 46px,radial-gradient(rgba(255,159,28,.18) 30%,transparent 32%) 23px 23px/46px 46px}
.deco i:nth-child(7){background:linear-gradient(90deg,#060f1c 0 34px,transparent 34px calc(100% - 34px),#060f1c calc(100% - 34px)),repeating-linear-gradient(transparent 0 10px,rgba(234,244,255,.8) 10px 26px,transparent 26px 34px) 10px 0/14px 100% no-repeat,repeating-linear-gradient(transparent 0 10px,rgba(234,244,255,.8) 10px 26px,transparent 26px 34px) calc(100% - 10px) 0/14px 100% no-repeat}

/* ---------- barra fixa ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:background-color .9s}
.bar .name{font:800 1rem/1 var(--ui)}
.bar .now{font:600 .82rem/1.2 var(--mono);color:var(--muted)}
.bar .now b{color:var(--acc);font-size:1rem}
.bar nav{margin-left:auto;display:flex;gap:6px 16px;flex-wrap:wrap}
.bar nav a{color:var(--fg);font:700 .9rem/1 var(--ui);display:inline-flex;align-items:center;min-height:36px;text-underline-offset:.3em}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--acc);width:0;transition:background-color .9s}

/* ---------- estrutura ---------- */
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
body[data-p="6"] .wrap{padding-inline:max(52px,env(safe-area-inset-left)) max(52px,env(safe-area-inset-right))}
.hero{padding-block:clamp(48px,10vh,110px) 40px}
.hero .eyebrow{font:600 .8rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
.hero h1{margin:0 0 14px;font:700 clamp(3.4rem,11vw,7.5rem)/.85 var(--display);letter-spacing:-.01em;text-wrap:balance}
.hero p{max-width:62ch;margin:0 0 12px;font-size:1.12rem;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:26px 0 0;padding:0;list-style:none}
.facts li{font:500 .95rem/1.2 var(--ui)}
.facts b{display:block;font:800 2.2rem/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--acc)}
.hint{margin-top:34px;font:600 .85rem/1 var(--mono);color:var(--muted)}

.period{padding-block:70px 10px}
.period header{border-top:3px solid var(--acc);padding-top:18px;margin-bottom:10px;transition:border-color .9s}
.period .span{font:700 .85rem/1 var(--mono);letter-spacing:.08em;color:var(--acc)}
.period h2{margin:.25em 0 .2em;font:700 clamp(2.4rem,7vw,4.6rem)/.92 var(--display);text-wrap:balance}
.period .sub{margin:0;max-width:62ch;font-size:1.1rem;color:var(--muted)}
.period .stats{margin:12px 0 0;font:600 .85rem/1.4 var(--mono);color:var(--muted)}
.year{display:grid;grid-template-columns:140px 1fr;gap:18px 26px;padding-block:34px;border-bottom:1px dashed var(--line)}
.year h3{margin:0;font:700 clamp(2.4rem,6vw,3.6rem)/.9 var(--display);color:var(--acc);position:sticky;top:76px;align-self:start;transition:color .9s}
.year h3 small{display:block;font:600 .78rem/1.4 var(--mono);color:var(--muted);margin-top:6px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px;min-width:0}
.empty{font-style:italic;color:var(--muted);margin:6px 0 0}
@media (max-width:640px){.year{grid-template-columns:1fr}.year h3{position:static}}

/* ---------- cartões das obras ---------- */
.work{display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:background-color .9s,border-color .9s,transform .25s,box-shadow .25s;min-width:0}
.work .pic{aspect-ratio:16/9;max-width:100%;background:var(--tc,#ccc);display:grid;place-items:center;overflow:hidden}
.work .pic img{width:100%;height:100%;object-fit:cover;display:block}
.work .pic span{padding:10px;text-align:center;font:800 1rem/1.15 var(--ui);color:#14110f}
.work .txt{padding:10px 12px 12px;display:grid;gap:6px;align-content:start}
.work h4{margin:0;font:700 1rem/1.25 var(--ui)}
.work h4 a{color:inherit;text-decoration-color:var(--acc);text-underline-offset:.2em}
.work .meta{margin:0;font:400 .86rem/1.4 var(--body);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:700 .68rem/1 var(--mono);padding:4px 6px;border-radius:2px;background:var(--tc,#ccc);color:#14110f}
.chip.role{background:transparent;color:var(--fg);border:1px solid var(--line)}
.chip.mine{background:var(--acc);color:var(--bg);border-color:transparent}
.chip.todo{background:transparent;color:var(--acc);border:1px dashed var(--acc)}
/* a forma dos cartões também muda */
body[data-p="0"] .work{border:1.5px dashed rgba(43,43,43,.45);border-radius:2px;transform:rotate(-.4deg)}
body[data-p="0"] .work:nth-child(even){transform:rotate(.5deg)}
body[data-p="1"] .work{border:3px solid #2a1500;border-radius:6px;box-shadow:5px 5px 0 #2a1500}
body[data-p="2"] .work{border-radius:0;border-width:1px 1px 4px}
body[data-p="3"] .work{border-radius:16px;box-shadow:0 0 0 1px rgba(123,227,138,.2),0 8px 24px rgba(0,0,0,.35)}
body[data-p="4"] .work{border:0;border-radius:0;background:transparent}
body[data-p="4"] .work h4{font:italic 400 1.15rem/1.2 "Playfair Display",Georgia,serif}
body[data-p="5"] .work{border:3px solid #2d0b4a;border-radius:22px}
body[data-p="6"] .work{border-radius:3px;border-top:6px solid #060f1c;position:relative}
body[data-p="6"] .work::before{content:"";position:absolute;left:6px;right:6px;top:-5px;height:4px;background:repeating-linear-gradient(90deg,rgba(234,244,255,.8) 0 8px,transparent 8px 16px)}
.work:hover{transform:translateY(-3px) rotate(0)}

.end{padding-block:90px 120px}
.end h2{margin:0 0 12px;font:700 clamp(2.6rem,8vw,5rem)/.9 var(--display)}
.end p{max-width:60ch;color:var(--muted);font-size:1.1rem}
.end nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.end nav a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:3px;background:var(--acc);color:var(--bg);font:800 1rem/1 var(--ui);text-decoration:none}
.end nav a+a{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
</head>
<body data-p="0">
<div class="deco" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="bar">
  <span class="name">Jorge Ribeiro</span>
  <span class="now" aria-live="polite"><b id="nowY">1999</b> · <span id="nowP"></span></span>
  <nav aria-label="Navegação"><a href="../filme.html">Filme</a><a href="../jogo.html">Jogos</a></nav>
  <div class="prog" id="prog"></div>
</div>
<main class="wrap" id="main">
  <section class="hero">
    <p class="eyebrow">Currículo · Porto</p>
    <h1>Jorge Ribeiro</h1>
    <p id="lead"></p>
    <p>Fundou Os Filmes do Pinguim, produtora de animação no UPTEC, no Porto.</p>
    <ul class="facts" id="facts"></ul>
    <p class="hint">↓ Desça para percorrer os anos. A página muda com o trabalho de cada período.</p>
  </section>
</main>
<script src="../data/obras.js"></script>
<script>
/* Tudo é gerado a partir de data/obras.js: um bloco por período, um por ano, um cartão por obra. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const last = 2026, first = TODAS[0].y;
const nReal = TODAS.filter(realizou).length, clients = new Set(TODAS.map(o => o.cli).filter(Boolean)).size, prods = new Set(TODAS.map(o => o.prod).filter(Boolean)).size;
$("lead").textContent = `Animador e realizador desde ${first}. Séries para a RTP, curtas-metragens, videoclipes, filmes institucionais e publicidade: ${TODAS.length} obras em ${last - first} anos.`;
$("facts").innerHTML = [[TODAS.length, "obras"], [nReal, "como realizador"], [clients, "clientes e artistas"], [prods, "produtoras"]].map(([n, l]) => `<li><b>${n}</b>${l}</li>`).join("");

const main = $("main");
PERIODOS.forEach((P, i) => {
  const to = i < PERIODOS.length - 1 ? PERIODOS[i + 1].de - 1 : last, list = TODAS.filter(o => o.y >= P.de && o.y <= to);
  const sec = document.createElement("section"); sec.className = "period"; sec.dataset.p = i;
  sec.innerHTML = `<header><span class="span">${P.de}–${i < PERIODOS.length - 1 ? to : "hoje"}</span><h2>${esc(P.titulo)}</h2><p class="sub">${esc(P.sub)}</p>
    <p class="stats">${list.length} obras · ${list.filter(realizou).length} realizadas por ele · ${new Set(list.map(o => o.prod).filter(Boolean)).size} produtoras</p></header>`;
  for (let y = P.de; y <= to; y++) {
    const ws = list.filter(o => o.y === y), yb = document.createElement("div"); yb.className = "year"; yb.dataset.y = y;
    yb.innerHTML = `<h3>${y}<small>${ws.length ? ws.length + (ws.length === 1 ? " obra" : " obras") : "sem obras registadas"}</small></h3>
      <div class="works">${ws.map(card).join("") || `<p class="empty">Nenhuma obra registada neste ano.</p>`}</div>`;
    sec.appendChild(yb);
  }
  main.appendChild(sec);
});
const end = document.createElement("section"); end.className = "end"; end.dataset.p = PERIODOS.length - 1;
end.innerHTML = `<h2>2026 — e a seguir?</h2><p>As obras posteriores a 2022 foram recolhidas em notícias e fichas de festivais e estão marcadas “a confirmar”.</p>
  <nav><a href="../filme.html">Ver o filme</a><a href="../jogo.html">Jogar os jogos</a></nav>`;
main.appendChild(end);

function card(o){
  const ty = TIPOS[o.tipo] || {c: "#ccc", s: o.tipo}, img = thumb(o), mine = realizou(o);
  const who = [o.cli && `Cliente/artista: ${o.cli}`, o.real && o.real !== NOME && `Realização: ${o.real}`, o.prod && `Produção: ${o.prod}`, o.ag && `Agência: ${o.ag}`, o.dur && `Duração: ${o.dur}`].filter(Boolean).map(esc).join("<br>");
  const title = o.url ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.t)}</a>` : esc(o.t);
  return `<article class="work" style="--tc:${ty.c}">
    <div class="pic">${img ? `<img src="../${img}" alt="" loading="lazy" width="320" height="180">` : `<span>${esc(o.t)}</span>`}</div>
    <div class="txt"><div class="chips"><span class="chip">${esc(ty.s)}</span>${o.fn ? `<span class="chip role${mine ? " mine" : ""}">${esc(o.fn.toLowerCase())}</span>` : ""}${o.src === "web" ? `<span class="chip todo">a confirmar</span>` : ""}</div>
      <h4>${title}</h4>${who ? `<p class="meta">${who}</p>` : ""}</div></article>`;
}

/* período e ano visíveis: a faixa do meio do ecrã decide */
const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
  const el = e.target;
  if (el.classList.contains("year")) { $("nowY").textContent = el.dataset.y; }
  else { document.body.dataset.p = el.dataset.p; $("nowP").textContent = PERIODOS[+el.dataset.p].titulo; } }), {rootMargin: "-45% 0px -50% 0px"});
document.querySelectorAll(".period,.year,.end").forEach(el => io.observe(el));
$("nowP").textContent = PERIODOS[0].titulo;
const prog = $("prog");
addEventListener("scroll", () => { const h = document.documentElement; prog.style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + "%"; }, {passive: true});
</script>
</body>
</html>
