function render(L) {
  const t = UI[L];
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.getElementById("aff").innerHTML = AFFILIATIONS[L].map((a, i) => `<li><sup>${i + 1}</sup>${a}</li>`).join("");
  document.getElementById("refs").innerHTML = TL_PERIODS.map((p, i) =>
    `<li><a href="trajetoria.html?lang=${L}#p${i}"><span class="n">${i + 1}</span><strong><em>${p}</em>${TL_TITLE[L][i]}</strong><span>${TL_KEY[i]}</span></a></li>`).join("");
  document.getElementById("companies").innerHTML = COMPANIES.map(c =>
    `<tr><td>${c.url ? `<a href="${c.url}">${c.name}</a>` : c.name}</td><td>${c[L] || `<span class="pend">${t.pend}</span>`}</td></tr>`).join("");

  const today = new Date().toISOString().slice(0, 10);
  const tf = (p, k) => (L === "en" && p[k + "_en"]) || p[k] || "";
  const byDate = INTERVENTIONS.slice().sort((a, b) => b.date.localeCompare(a.date));
  const talks = [...byDate.filter(p => p.date > today).reverse().slice(0, 1).map(p => [p, true]), ...byDate.filter(p => p.date <= today).slice(0, 3).map(p => [p, false])];
  let n = PROFILES.length;
  document.getElementById("talks").innerHTML = talks.map(([p, up]) =>
    `<li><span>[${++n}]</span><span>${up ? `<span class="up">${t.next}</span>` : ""}Cruz-Correia R. <i>${tf(p, "title")}</i>. ${tf(p, "event")}${tf(p, "place") ? ", " + tf(p, "place") : ""}; ${p.date.slice(0, 4)}. <a href="intervencoes/?lang=${L}">${L === "en" ? "Talks" : "Intervenções"}</a></span></li>`).join("");
  document.getElementById("bib").innerHTML = PROFILES.map(([l, u], i) => `<li><span>[${i + 1}]</span><a href="${u}">${l}</a></li>`).join("");
  document.getElementById("supp").innerHTML = SUPP.map(s =>
    `<li><a href="${s.url}?lang=${L}"><span class="c">${s.c}</span><b>${s[L][0]}</b><span>${s[L][1]}</span></a></li>`).join("");
  Site.figure(document.getElementById("fig"), L);
}

Site.controls(render);
